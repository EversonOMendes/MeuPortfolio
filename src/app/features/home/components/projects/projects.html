<div class="container">
  <app-section-header eyebrow="Projetos">
    <h2>Projetos em <span class="hl">destaque.</span></h2>
  </app-section-header>

  <div class="company">
    <app-logo-tile [src]="company.logo" [alt]="'Logo da ' + company.name" [size]="88" />
    <div class="company__text">
      <span class="company__kicker">{{ company.tagline }}</span>
      <h3>
        {{ company.name }} <small class="company__full">{{ company.fullName }}</small>
      </h3>
      <p>{{ company.description }}</p>
    </div>
    <a appButton variant="outline" size="sm" [href]="company.url" target="_blank" rel="noopener">
      Conhecer a empresa <app-icon name="external" [size]="16" />
    </a>
  </div>

  <ul class="projects">
    @for (project of projects; track project.id) {
      <li>
        <app-project-card [project]="project" (details)="openDetails($event)" />
      </li>
    }
  </ul>
</div>

<app-project-details-modal [(project)]="selected" />
